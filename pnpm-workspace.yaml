# Parla is not on npm yet: `pnpm parla:update` packs ../parla into .packs/.
overrides:
  '@parlajs/core': file:.packs/parlajs-core-0.0.0.tgz
  '@parlajs/react': file:.packs/parlajs-react-0.0.0.tgz
  '@parlajs/compiler': file:.packs/parlajs-compiler-0.0.0.tgz
  '@parlajs/format-icu': file:.packs/parlajs-format-icu-0.0.0.tgz
  '@parlajs/format-mf2': file:.packs/parlajs-format-mf2-0.0.0.tgz

allowBuilds:
  # fetches its platform binary in a postinstall
  esbuild: true

# Deliberately stricter than pnpm's 1440 default (3 days vs 1)
minimumReleaseAge: 4320

# The cooling-off period buys nothing against our own packages.
minimumReleaseAgeExclude:
  - '@marcalexiei/oxfmt-config'
  - '@marcalexiei/oxlint-config'
